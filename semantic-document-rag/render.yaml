# Render Blueprint (optional). You can also create the service by hand in the dashboard.
services:
  - type: web
    name: documind-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: LLM_BASE_URL
        value: ""
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app
